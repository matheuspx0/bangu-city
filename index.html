 }
 if(e.target.id==='qualityBtn'){e.target.textContent=e.target.textContent.includes('ALTO')?'GRÁFICOS: ECONÔMICO':'GRÁFICOS: ALTO';R.setPixelRatio(Math.min(devicePixelRatio,e.target.textContent.includes('ECONÔMICO')?1:1.65));}

});

const R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,1.65));R.setSize(innerWidth,innerHeight);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.94,metalness:0.0});
const noiseCanvas=document.createElement('canvas');noiseCanvas.width=256;noiseCanvas.height=256;
const ng=noiseCanvas.getContext('2d');const pixels=ng.createImageData(256,256);
for(let i=0;i<pixels.data.length;i+=4){const v=105+Math.random()*48;pixels.data[i]=v;pixels.data[i+1]=v;pixels.data[i+2]=v;pixels.data[i+3]=22;}
ng.putImageData(pixels,0,0);
const grain=new THREE.CanvasTexture(noiseCanvas);grain.wrapS=grain.wrapT=THREE.RepeatWrapping;
grain.repeat.set(3,3);grain.needsUpdate=true;

let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const y0=.12,solids=[];
function box(x,z,w,d,h,c,solid,y=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y+h/2,z);S.add(m);if(solid)solids.push({x,z,hx:w/2,hz:d/2});return m}
const flat=(x,z,w,d,c,y)=>{const m=box(x,z,w,d,.02,c,false,y);m.material.map=grain;m.material.color.multiplyScalar(.92);m.material.needsUpdate=true;return m;};

// chão, ruas, campo, quadra (escala 1 unidade = 1 m, norte = -z)
box(0,0,600,600,.12,0x6fae4f,false,0);
const road=(x,z,w,d,r)=>{const m=box(x,z,w,d,.02,0x5c5f63,false,y0);m.rotation.y=r||0};
road(-35,0,6,260);road(25,33,150,6);road(47.5,-90,6,208,.297);
flat(-25,0,2.5,56,0x8a857c,y0);flat(25,26.5,100,2.5,0x8a857c,y0);
flat(38,3,60,35,0xd8c49a,y0);
// Piso realista da quadra inspirado na foto: concreto/cimento queimado esverdeado com áreas avermelhadas, juntas, rachaduras e marcações brancas
const courtTexCanvas=document.createElement('canvas');
courtTexCanvas.width=1024;courtTexCanvas.height=1024;
const ctg=courtTexCanvas.getContext('2d');

// Base de cimento queimado esverdeado/acinzentado como na foto
ctg.fillStyle='#6c7868';
ctg.fillRect(0,0,1024,1024);

// Manchas orgânicas de desgaste, sujeira e umidade no piso
for(let i=0;i<160;i++){
 const mx=Math.random()*1024, my=Math.random()*1024, mr=28+Math.random()*115;
 const grad=ctg.createRadialGradient(mx,my,mr*0.1,mx,my,mr);
 const dark=Math.random()>0.45;
 grad.addColorStop(0, dark ? 'rgba(42,48,40,0.16)' : 'rgba(155,166,146,0.13)');
 grad.addColorStop(1, 'rgba(108,120,104,0)');
 ctg.fillStyle=grad;
 ctg.beginPath();ctg.arc(mx,my,mr,0,Math.PI*2);ctg.fill();
}

// Áreas avermelhadas/terracota nas pontas da quadra (norte e sul)
const redAreaH=Math.round(1024*(9/44));
ctg.fillStyle='rgba(156,74,64,0.78)';
ctg.fillRect(0,0,1024,redAreaH);
ctg.fillRect(0,1024-redAreaH,1024,redAreaH);

// Círculo/meia-lua avermelhada no centro e nas áreas como na foto
ctg.save();
ctg.fillStyle='rgba(150,72,63,0.52)';
ctg.beginPath();ctg.arc(512,512,118,0,Math.PI*2);ctg.fill();
ctg.restore();

// Grão fino de concreto
const cImg=ctg.getImageData(0,0,1024,1024);
for(let i=0;i<cImg.data.length;i+=4){
 const n=(Math.random()-0.5)*26;
 cImg.data[i]=Math.max(0,Math.min(255,cImg.data[i]+n));
 cImg.data[i+1]=Math.max(0,Math.min(255,cImg.data[i+1]+n));
 cImg.data[i+2]=Math.max(0,Math.min(255,cImg.data[i+2]+n));
}
ctg.putImageData(cImg,0,0);

// Linhas brancas da quadra (borda, meio de campo, círculo central e áreas)
ctg.strokeStyle='rgba(244,246,242,0.82)';
ctg.lineWidth=7;
ctg.strokeRect(46,36,1024-92,1024-72);
ctg.beginPath();
ctg.moveTo(46,512);ctg.lineTo(1024-46,512);
ctg.arc(512,512,118,0,Math.PI*2);
ctg.stroke();
// Áreas / garrafões
ctg.strokeRect(250,36,524,175);
ctg.strokeRect(250,1024-211,524,175);
ctg.beginPath();
ctg.arc(512,211,92,0,Math.PI);
ctg.moveTo(512+92,1024-211);
ctg.arc(512,1024-211,92,Math.PI,0);
ctg.stroke();

// Juntas de dilatação e rachaduras naturais do concreto
ctg.strokeStyle='rgba(36,41,35,0.48)';
ctg.lineWidth=2.5;
for(let gx=170;gx<1024;gx+=170){
 ctg.beginPath();ctg.moveTo(gx,0);ctg.lineTo(gx+((Math.random()-0.5)*10),1024);ctg.stroke();
}
for(let gy=170;gy<1024;gy+=170){
 ctg.beginPath();ctg.moveTo(0,gy);ctg.lineTo(1024,gy+((Math.random()-0.5)*10));ctg.stroke();
}
// Rachadura diagonal marcante como no piso da foto
ctg.strokeStyle='rgba(28,32,27,0.62)';
ctg.lineWidth=3;
ctg.beginPath();
let crX=640,crY=1024;
ctg.moveTo(crX,crY);
for(let s=0;s<18;s++){
 crX+=(Math.random()-0.56)*34;
 crY-=48+Math.random()*14;
 ctg.lineTo(crX,crY);
}
ctg.stroke();

const courtTex=new THREE.CanvasTexture(courtTexCanvas);
courtTex.anisotropy=8;
courtTex.needsUpdate=true;
const courtMat=new THREE.MeshStandardMaterial({map:courtTex,roughness:.78,metalness:.04});
const courtFloor=new THREE.Mesh(new THREE.BoxGeometry(26,.04,44),courtMat);
courtFloor.position.set(-9,y0+.02,-1.5);
courtFloor.receiveShadow=true;
S.add(courtFloor);

function fence(cx,cz,w,d,g=4,n=0){const seg=(x,z,ww,dd)=>{const m=box(x,z,ww,dd,3.4,0x7c8782,true,y0);m.material.transparent=true;m.material.opacity=.55};
 const gs=z=>{seg(cx-(w/4+g/4),z,w/2-g/2,.15);seg(cx+(w/4+g/4),z,w/2-g/2,.15)};n?gs(cz-d/2):seg(cx,cz-d/2,w,.15);seg(cx-w/2,cz,.15,d);seg(cx+w/2,cz,.15,d);
 gs(cz+d/2)}
(()=>{const seg=(x,z,ww,dd)=>{const m=box(x,z,ww,dd,3.4,0x7c8782,true,y0);m.material.transparent=true;m.material.opacity=.55};seg(-9,-24.5,28,.15);seg(-9,21.5,28,.15);seg(-23,-1.5,.15,26);seg(5,-1.5,.15,26)})();fence(38,3,62,37);

function goal(x,z){[-3.6,3.6].forEach(o=>box(x,z+o,.12,.12,4.4,0xffffff,false,y0));box(x,z,.12,7.4,.12,0xffffff,false,y0+4.2)}
function goalZ(x,z){
 const mat=M(0xf4f4f0);
 const post=(px,py,pz,h)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,h,16),mat);m.position.set(px,py,pz);m.castShadow=true;S.add(m)};
 const cross=(px,py,pz,w)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,w,16),mat);m.rotation.z=Math.PI/2;m.position.set(px,py,pz);m.castShadow=true;S.add(m)};
 post(x-4.1,y0+2.5,z,5);post(x+4.1,y0+2.5,z,5);cross(x,y0+5,z,8.4);
 // Rede estendida até a grade do fundo da quadra
 const depth=1.6;
 const net=new THREE.Mesh(new THREE.BoxGeometry(8.2,4.9,depth),new THREE.MeshBasicMaterial({color:0xe8eee9,wireframe:true,transparent:true,opacity:.32}));
 net.position.set(x,y0+2.45,z+(z<0?-depth/2:depth/2));
 S.add(net);
}
goal(8.8,3);goal(67.2,3);goalZ(-9,-22.8);goalZ(-9,19.8);

// árvores
function tree(x,z,s=1){const t=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.35*s,3*s,9),M(0x60432f));t.position.set(x,y0+1.5*s,z);t.castShadow=true;t.receiveShadow=true;S.add(t);
 const foliage=rnd()>.5?0x286b36:0x397d3d;
 const f=new THREE.Mesh(new THREE.IcosahedronGeometry(2.3*s,1),M(foliage));f.scale.y=.9;f.position.set(x,y0+4.2*s,z);f.castShadow=true;f.receiveShadow=true;S.add(f);
 for(let k=0;k<3;k++){const cl=new THREE.Mesh(new THREE.IcosahedronGeometry(.95*s,1),M(foliage));cl.position.set(x+(rnd()-.5)*2*s,y0+(3.7+rnd()*1.6)*s,z+(rnd()-.5)*2*s);cl.castShadow=true;S.add(cl)}solids.push({x,z,hx:.5,hz:.5})}
const zones=[[-9,-1.5,32,52],[38,3,66,42],[-25,0,5,58],[25,26.5,102,5],[38,-19,66,5],[62,-30,14,30],[-29,-3,5,14],[-28,14,6,5],[-28,9,5,6],[6,29,12,5],[72,5,7,40]];
for(let i=0,n=0;i<800&&n<38;i++){const x=rnd()*98-32,z=rnd()*58-30;
 if(zones.some(([a,b,w,d])=>Math.abs(x-a)<w/2&&Math.abs(z-b)<d/2))continue;tree(x,z,.9+rnd()*.5);n++}
[-20,0,20,40,60,80].forEach(x=>tree(x,41+rnd()*4,1));
for(let x=-12;x<=100;x+=7){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(2,0),M(0x2f6f3a));const bz=53+Math.sin(x*.3)*2;b.position.set(x,y0+1,bz);S.add(b);solids.push({x,z:bz,hx:1.2,hz:1.2})}

const ballGroup=new THREE.Group();
const ballMesh=new THREE.Group();
const ballRadius=.43;
ballMesh.position.y=ballRadius; // Eleva o centro da esfera + painéis juntos

const ball=new THREE.Mesh(

);

// 12 vértices exatos de um icosaedro regular para distribuir os 12 pentágonos simetricamente
const phi=(1+Math.sqrt(5))/2;
const icoVerts=[
 [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
 [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
 [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
].map(([x,y,z])=>new THREE.Vector3(x,y,z).normalize());

const panelShape=new THREE.Shape();
const pRad=ballRadius*0.34;
for(let i=0;i<5;i++){
 const a=-Math.PI/2+i*Math.PI*2/5;
 const x=Math.cos(a)*pRad,y=Math.sin(a)*pRad;
 if(i===0)panelShape.moveTo(x,y);else panelShape.lineTo(x,y);
}
panelShape.closePath();
const panelGeo=new THREE.ShapeGeometry(panelShape);
const panelMat=new THREE.MeshStandardMaterial({
 color:0x17191b,
 roughness:.7,
 polygonOffset:true,
 polygonOffsetFactor:-2
});

for(const dir of icoVerts){
 const panel=new THREE.Mesh(panelGeo,panelMat);
 panel.position.copy(dir).multiplyScalar(ballRadius*0.975);
 panel.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir);
 ballMesh.add(panel);
}

S.add(ballGroup);

  brow.position.set(ex,0.052,0.168);headGroup.add(brow);
 });
 const mouth=new THREE.Mesh(new THREE.BoxGeometry(0.055,0.01,0.015),new THREE.MeshStandardMaterial({color:0x7c4338,roughness:0.8}));
 mouth.position.set(0,-0.075,0.162);headGroup.add(mouth);

 if(cfg.hairStyle==='fade'){
  const topHair=new THREE.Mesh(new THREE.SphereGeometry(0.192,20,14,0,Math.PI*2,0,Math.PI*0.52),hairMat);
  topHair.scale.set(0.95,1.08,1.02);topHair.position.set(0,0.02,-0.01);headGroup.add(topHair);
 }else if(cfg.hairStyle==='buzz'){
  const buzz=new THREE.Mesh(new THREE.SphereGeometry(0.188,20,14,0,Math.PI*2,0,Math.PI*0.56),hairMat);
  buzz.scale.set(0.93,1.11,0.99);buzz.position.set(0,0.01,-0.01);headGroup.add(buzz);
 }else{
  const taper=new THREE.Mesh(new THREE.SphereGeometry(0.198,20,14,0,Math.PI*2,0,Math.PI*0.54),hairMat);
  taper.scale.set(0.96,1.14,1.04);taper.position.set(0,0.025,-0.01);headGroup.add(taper);
  const fringe=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.045,0.07),hairMat);
  fringe.position.set(0,0.135,0.13);fringe.rotation.x=0.25;headGroup.add(fringe);
 }
 if(cfg.beard){
  const beardMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.098,0.095,16,1,false,-Math.PI*0.45,Math.PI*0.9),hairMat);
  beardMesh.scale.set(0.94,1,0.98);beardMesh.position.set(0,-0.105,0.032);headGroup.add(beardMesh);
 }

 const rLegs=[-0.125,0.125].map(lx=>{
  const g=new THREE.Group();g.position.set(lx,0.92,0);
  const shortLeg=new THREE.Mesh(new THREE.CylinderGeometry(0.105,0.092,0.28,14),shortsMat);shortLeg.position.y=-0.13;g.add(shortLeg);
  const thigh=new THREE.Mesh(new THREE.CylinderGeometry(0.082,0.068,0.22,14),skinMat);thigh.position.y=-0.34;g.add(thigh);
  const knee=new THREE.Mesh(new THREE.SphereGeometry(0.068,12,10),skinMat);knee.position.y=-0.46;g.add(knee);
  const sock=new THREE.Mesh(new THREE.CylinderGeometry(0.066,0.052,0.34,14),socksMat);sock.position.y=-0.64;g.add(sock);
  const sockBand=new THREE.Mesh(new THREE.CylinderGeometry(0.068,0.068,0.035,14),trimMat);sockBand.position.y=-0.49;g.add(sockBand);
  const shoe=new THREE.Mesh(new THREE.BoxGeometry(0.115,0.075,0.25),cleatMat);shoe.position.set(0,-0.84,0.045);g.add(shoe);
  const toe=new THREE.Mesh(new THREE.SphereGeometry(0.058,12,10),cleatMat);toe.scale.set(1,0.65,1.2);toe.position.set(0,-0.845,0.15);g.add(toe);
  body.add(g);return g;
 });
 const rArms=[-0.31,0.31].map(ax=>{
  const g=new THREE.Group();g.position.set(ax,1.60,0);
  const shoulder=new THREE.Mesh(new THREE.SphereGeometry(0.082,14,12),shirtMat);g.add(shoulder);
  const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(0.078,0.072,0.20,14),shirtMat);sleeve.position.y=-0.10;g.add(sleeve);
  const upperArm=new THREE.Mesh(new THREE.CylinderGeometry(0.062,0.055,0.18,12),skinMat);upperArm.position.y=-0.27;g.add(upperArm);
  const forearm=new THREE.Mesh(new THREE.CylinderGeometry(0.054,0.044,0.22,12),skinMat);forearm.position.set(0,-0.45,0.015);forearm.rotation.x=-0.12;g.add(forearm);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(0.048,10,10),skinMat);hand.scale.set(0.85,1.15,0.65);hand.position.set(0,-0.57,0.03);g.add(hand);
  body.add(g);return g;
 });

 const nameTag=makeNameTag(cfg.name);
 nameTag.position.y=2.32*cfg.heightScale;
 root.add(nameTag);
 root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return {root,rLegs,rArms,charId:id};
}

function updateOnlineBadge(){
 const el=$('onlineCount');
 if(el) el.textContent='ONLINE: '+(remotePlayers.size+1);
}

function upsertRemotePlayer(p){
 if(!p || p.id===myPlayerId) return;
 let entry=remotePlayers.get(p.id);
 if(!entry || entry.charId!==p.charId){
  if(entry) S.remove(entry.mesh.root);
  const mesh=buildCharacterMesh(p.charId||'armando');
  mesh.root.position.set(p.x||-13,p.y||y0,p.z||4);
  mesh.root.rotation.y=p.ry||0;
  S.add(mesh.root);
  entry={mesh,charId:p.charId||'armando',tx:p.x||-13,ty:p.y||y0,tz:p.z||4,try:p.ry||0,moving:false,running:false,animT:0};
  remotePlayers.set(p.id,entry);
  updateOnlineBadge();
 }
 entry.tx=p.x;entry.ty=p.y;entry.tz=p.z;entry.try=p.ry;
 entry.moving=Boolean(p.moving);entry.running=Boolean(p.running);
}
function connectMultiplayer(){
 if(!location.host) return;
 const proto=location.protocol==='https:'?'wss:':'ws:';
 try{
  ws=new WebSocket(`${proto}//${location.host}`);
  ws.onmessage=ev=>{
   const msg=JSON.parse(ev.data);
   if(msg.type==='init'){
    myPlayerId=msg.id;
    (msg.players||[]).forEach(upsertRemotePlayer);
    if(msg.ball){
     ballGroup.position.set(msg.ball.x,msg.ball.y,msg.ball.z);
     ballVx=msg.ball.vx;ballVy=msg.ball.vy;ballVz=msg.ball.vz;
     goalCount=msg.ball.goals||0;$('scoreValue').textContent=goalCount;
    }
    updateOnlineBadge();
   }else if(msg.type==='player_join'||msg.type==='player_state'){
    upsertRemotePlayer(msg.player);
   }else if(msg.type==='player_leave'){
    const entry=remotePlayers.get(msg.id);
    if(entry){S.remove(entry.mesh.root);remotePlayers.delete(msg.id);updateOnlineBadge();}
   }else if(msg.type==='ball_sync' && msg.ball){
    ballGroup.position.set(msg.ball.x,msg.ball.y,msg.ball.z);
    ballVx=msg.ball.vx;ballVy=msg.ball.vy;ballVz=msg.ball.vz;
    if(typeof msg.ball.goals==='number'){goalCount=msg.ball.goals;$('scoreValue').textContent=goalCount;}
   }
  };
  ws.onclose=()=>setTimeout(connectMultiplayer,2500);
 }catch(e){}
}
connectMultiplayer();

function sendBallSync(){
 if(ws && ws.readyState===1){
  ws.send(JSON.stringify({
   type:'ball_update',
   x:ballGroup.position.x,y:ballGroup.position.y,z:ballGroup.position.z,
   vx:ballVx,vy:ballVy,vz:ballVz,goals:goalCount
  }));
 }
}


// controles
const joy=$('joy'),knob=$('knob');let jid=null,jx=0,jy=0,running=false,jump=false;
function mv(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const L=Math.hypot(dx,dy),m=44;if(L>m){dx*=m/L;dy*=m/L}jx=dx/m;jy=-dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
joy.onpointerdown=e=>{e.preventDefault();e.stopPropagation();jid=e.pointerId;joy.setPointerCapture(jid);mv(e)};
joy.onpointermove=e=>{if(e.pointerId===jid){e.preventDefault();mv(e)}};
joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform='translate(0,0)'}};
$('run').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();running=!running;e.currentTarget.classList.toggle('on',running)});
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();jump=true});
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space'){jump=true;e.preventDefault()}});addEventListener('keyup',e=>keys[e.code]=0);

let cy=Math.PI,pitch=2.6,did=null,lx=0,ly=0,autoCamera=true;const cv2=R.domElement;
cv2.onpointerdown=e=>{did=e.pointerId;autoCamera=false;lx=e.clientX;ly=e.clientY;cv2.setPointerCapture(did)};
cv2.onpointermove=e=>{if(e.pointerId!==did)return;cy-=(e.clientX-lx)*.008;pitch=Math.max(1.7,Math.min(5.2,pitch+(e.clientY-ly)*.022));lx=e.clientX;ly=e.clientY};
cv2.onpointerup=cv2.onpointercancel=()=>{did=null;autoCamera=true};
setTimeout(()=>{$('hint').style.opacity=0},7000);
addEventListener('resize',()=>{R.setPixelRatio(Math.min(devicePixelRatio,1.65));R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});

// loop
let px=-13,pz=4,py=y0,vy=0,ground=true,last=performance.now(),tt=0;const cp=new THREE.Vector3();
const hit=(x,z)=>solids.some(o=>Math.abs(x-o.x)<o.hx+.4&&Math.abs(z-o.z)<o.hz+.4);
function step(dx,dz){px+=dx;pz+=dz;if(hit(px,pz)||Math.abs(px)>110||Math.abs(pz)>110){px-=dx;pz-=dz}}
const axisX=new THREE.Vector3(1,0,0),axisZ=new THREE.Vector3(0,0,1);

function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.05);
 last=now;
 if(!gameStarted){R.render(S,C);return;}
 if(goalBusy){R.render(S,C);return;}

 let ix=jx+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
 let iy=jy+(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
 const L=Math.hypot(ix,iy);if(L>1){ix/=L;iy/=L}
 const sp=(running||keys.ShiftLeft)?7.2:4.2;
 const dx=(-Math.sin(cy)*iy+Math.cos(cy)*ix)*sp*dt;
 const dz=(-Math.cos(cy)*iy-Math.sin(cy)*ix)*sp*dt;
 step(dx,0);step(0,dz);
 if(L>.1){
  const tg=Math.atan2(dx,dz),d=((tg-P.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
  P.rotation.y+=d*Math.min(1,dt*9);tt+=dt*sp*1.35;
  const w=Math.sin(tt)*(sp>6?1.1:.8);
  legs[0].rotation.x=w;legs[1].rotation.x=-w;arms[0].rotation.x=-w*.9;arms[1].rotation.x=w*.9
 }else{
  legs[0].rotation.x=legs[1].rotation.x=arms[0].rotation.x=arms[1].rotation.x=0
 }
 if(jump&&ground){vy=7.5;ground=false}jump=false;
 vy-=20*dt;py+=vy*dt;if(py<=y0){py=y0;vy=0;ground=true}
 P.position.set(px,py,pz);

 if(autoCamera && L < .1){
  let target=P.rotation.y+Math.PI;
  let delta=((target-cy+Math.PI*3)%(Math.PI*2))-Math.PI;
  cy+=delta*Math.min(1,dt*3.2);
 }

 // Física da bola: velocidade, gravidade, quique e atrito.
 const prevX=ballGroup.position.x, prevZ=ballGroup.position.z;
 ballGroup.position.x += ballVx * dt;
 ballGroup.position.z += ballVz * dt;
 ballGroup.position.y += ballVy * dt;
 ballVy -= 18 * dt;
 if(ballGroup.position.y < y0){
  ballGroup.position.y = y0;
  if(Math.abs(ballVy) > 1.1) ballVy = -ballVy * .38;
  else ballVy = 0;
 }
 const drag = Math.pow(.982, dt * 60);
 ballVx *= drag; ballVz *= drag;
 if(Math.hypot(ballVx,ballVz) < .08){ballVx=0;ballVz=0;}

 // Ao encostar, o personagem empurra a bola.
 const pdx=ballGroup.position.x-px, pdz=ballGroup.position.z-pz;
 const playerDist=Math.hypot(pdx,pdz);
 if(playerDist < .95 && ballGroup.position.y < y0+1.15){
  const nx=pdx/Math.max(playerDist,.001), nz=pdz/Math.max(playerDist,.001);
  ballGroup.position.x=px+nx*.96; ballGroup.position.z=pz+nz*.96;
  ballVx+=nx*2.2; ballVz+=nz*2.2; sendBallSync();
 }

 // Detecta a bola cruzando a linha do gol dentro da abertura e abaixo do travessão.
 const goalNorth=ballGroup.position.z < -22.8 && prevZ >= -22.8 && Math.abs(ballGroup.position.x+9)<(4.1-ballRadius*.45) && ballGroup.position.y < y0+4.55;
 const goalSouth=ballGroup.position.z > 19.8 && prevZ <= 19.8 && Math.abs(ballGroup.position.x+9)<(4.1-ballRadius*.45) && ballGroup.position.y < y0+4.55;
 if((goalNorth||goalSouth) && !goalBusy){
  goalBusy=true;goalCount++;$('scoreValue').textContent=goalCount;sendBallSync();$('goalFlash').classList.remove('show');void $('goalFlash').offsetWidth;$('goalFlash').classList.add('show');
  ballVx*=0.35;ballVz*=0.35;ballVy=0;
  clearTimeout(goalTimer);goalTimer=setTimeout(()=>{ballGroup.position.set(-9,y0,-1.5);ballVx=ballVz=ballVy=0;goalBusy=false;$('goalFlash').classList.remove('show');},1900);
 }

 // CORRIGIDO: A grade da quadra e a rede do gol bloqueiam a bola (não atravessa mais o fundo)
 const fenceLeft=-22.9, fenceRight=4.9, fenceTop=-24.4, fenceBottom=21.4;
 if(ballGroup.position.x < fenceLeft+ballRadius){
  ballGroup.position.x=fenceLeft+ballRadius;
  if(ballVx<0) ballVx=-ballVx*.58;
 }
 if(ballGroup.position.x > fenceRight-ballRadius){
  ballGroup.position.x=fenceRight-ballRadius;
  if(ballVx>0) ballVx=-ballVx*.58;
 }
 // Parede da rede/grade no fundo do gol (absorve o impacto como rede real)
 if(ballGroup.position.z < fenceTop+ballRadius){
  ballGroup.position.z=fenceTop+ballRadius;
  if(ballVz<0) ballVz=-ballVz*.25;
 }
 if(ballGroup.position.z > fenceBottom-ballRadius){
  ballGroup.position.z=fenceBottom-ballRadius;
  if(ballVz>0) ballVz=-ballVz*.25;
 }

 // Laterais internas da rede do gol (impede a bola de sair pelos lados depois de cruzar a linha)
 if(ballGroup.position.z < -22.8 || ballGroup.position.z > 19.8){
  if(prevX >= -13.1+ballRadius && ballGroup.position.x < -13.1+ballRadius){
   ballGroup.position.x=-13.1+ballRadius;
   if(ballVx<0) ballVx=-ballVx*.35;
  }
  if(prevX <= -4.9-ballRadius && ballGroup.position.x > -4.9-ballRadius){
   ballGroup.position.x=-4.9-ballRadius;
   if(ballVx>0) ballVx=-ballVx*.35;
  }
 }

 // Impacto físico nos postes e no travessão
 for(const gz of [-22.8,19.8]){
  for(const gx of [-13.1,-4.9]){
   const dx=ballGroup.position.x-gx,dz=ballGroup.position.z-gz,d=Math.hypot(dx,dz),minD=ballRadius+.11;
   if(d<minD && ballGroup.position.y<y0+5.15){
    const nx=dx/Math.max(d,.001),nz=dz/Math.max(d,.001);
    ballGroup.position.x=gx+nx*minD;ballGroup.position.z=gz+nz*minD;
    const vn=ballVx*nx+ballVz*nz;if(vn<0){ballVx-=1.55*vn*nx;ballVz-=1.55*vn*nz;}
   }
  }
  const dx=ballGroup.position.x+9,dy=(ballGroup.position.y+ballRadius)-(y0+5),dz=ballGroup.position.z-gz;
  if(Math.abs(dx)<4.25 && Math.abs(dz)<.28 && Math.abs(dy)<ballRadius+.11){
   ballGroup.position.y=(dy<0?y0+5-ballRadius-.11:y0+5+ballRadius+.11)-ballRadius;
   if((dy<0&&ballVy>0)||(dy>=0&&ballVy<0))ballVy=-ballVy*.62;
  }
 }

 // Limites externos do mapa
 if(Math.abs(ballGroup.position.x)>108){ballGroup.position.x=Math.sign(ballGroup.position.x)*108;ballVx*=-.45;}
 if(Math.abs(ballGroup.position.z)>108){ballGroup.position.z=Math.sign(ballGroup.position.z)*108;ballVz*=-.45;}

 // Rotação realista da bola ao redor do próprio centro nos eixos do mundo
 ballMesh.rotateOnWorldAxis(axisX, (ballVz * dt) / ballRadius);
 ballMesh.rotateOnWorldAxis(axisZ, -(ballVx * dt) / ballRadius);

 cp.set(px+Math.sin(cy)*4.8,py+pitch,pz+Math.cos(cy)*4.8);
 C.position.lerp(cp,Math.min(1,dt*8));
 C.lookAt(px,py+1.45,pz);
 // Atualiza interpolação dos amigos online e envia minha posição
 for(const entry of remotePlayers.values()){
  entry.mesh.root.position.x+=(entry.tx-entry.mesh.root.position.x)*Math.min(1,dt*12);
  entry.mesh.root.position.y+=(entry.ty-entry.mesh.root.position.y)*Math.min(1,dt*12);
  entry.mesh.root.position.z+=(entry.tz-entry.mesh.root.position.z)*Math.min(1,dt*12);
  const rd=((entry.try-entry.mesh.root.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
  entry.mesh.root.rotation.y+=rd*Math.min(1,dt*12);
  if(entry.moving){
   entry.animT+=dt*(entry.running?9.5:5.6);
   const rw=Math.sin(entry.animT)*(entry.running?1.1:.8);
   entry.mesh.rLegs[0].rotation.x=rw;entry.mesh.rLegs[1].rotation.x=-rw;
   entry.mesh.rArms[0].rotation.x=-rw*.9;entry.mesh.rArms[1].rotation.x=rw*.9;
  }else{
   entry.mesh.rLegs[0].rotation.x=entry.mesh.rLegs[1].rotation.x=0;
   entry.mesh.rArms[0].rotation.x=entry.mesh.rArms[1].rotation.x=0;
  }
 }
 if(ws && ws.readyState===1 && now-lastNetSend>50){
  lastNetSend=now;
  ws.send(JSON.stringify({
   type:'state',charId:selectedChar,x:px,y:py,z:pz,ry:P.rotation.y,
   moving:L>.1,running:Boolean(running||keys.ShiftLeft)
  }));
 }
 R.render(S,C);
}
requestAnimationFrame(loop);
